<!DOCTYPE html>
<html>
<head>
    <title>Upload File</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
            background-color: #f4f4f4;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fff;
            width: 300px;
        }
        input, button {
            padding: 10px;
            font-size: 14px;
        }
        button {
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h2>Upload Your File</h2>
    <form action="https://submit.formspark.io/form_v1_S6J1bEk8yddxBsyziIZ4xKvm" method="POST" enctype="multipart/form-data">
        <input type="text" name="full-name" placeholder="Your Name" required>
        <input type="file" name="file" required>
        <button type="submit">Send</button>
    </form>
</body>
</html>
