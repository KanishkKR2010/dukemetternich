<!DOCTYPE html>
<html>
<head>
    <title>Long Text Submission</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
            background-color: #f4f4f4;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #fff;
            width: 500px;
        }
        input, textarea, button {
            padding: 10px;
            font-size: 14px;
            width: 100%;
        }
        textarea {
            height: 300px; /* adjust as needed */
            resize: vertical;
        }
        button {
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h2>Submit Long Text</h2>
    <form action="https://formspree.io/f/myznyepe" method="POST">
        <label>
            Your Name:
            <input type="text" name="full-name" placeholder="Your Name" required>
        </label>

        <label>
            Long Description:
            <textarea name="long-description" placeholder="Paste your text here" required></textarea>
        </label>
        <button type="submit">Send</button>
    </form>
</body>
</html>
