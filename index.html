<!DOCTYPE html>
<html>
<head>
    <title>File Upload Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
            background-color: #f4f4f4;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #fff;
            width: 300px;
        }
        input, textarea, button {
            padding: 10px;
            font-size: 14px;
        }
        button {
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <h2>Upload Your File</h2>
    <form action="https://formspree.io/f/myznyepe" method="POST" enctype="multipart/form-data">
        <label>
            Your Name:
            <input type="text" name="full-name" required>
        </label>
        <label>
            Your Email:
            <input type="email" name="email" required>
        </label>
        <label>
            Upload File:
            <input type="file" name="file" required>
        </label>
        <button type="submit">Send</button>
    </form>
</body>
</html>
